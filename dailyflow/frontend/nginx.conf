server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # REST API + docs go to the Spring Boot container (same origin, so no CORS needed).
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /v3/ { proxy_pass http://backend:8080; }
  location /swagger-ui { proxy_pass http://backend:8080; }

  # Angular client-side routing
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|ico|png|svg|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
}
