spring.application.name=dailyflow

# ---- Database (local development values; use environment variables in production) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dailyflow?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
spring.datasource.username=root
spring.datasource.password=MySql@123
#server.address=172.16.21.15
#server.address=172.16.1.216
#server.address=127.0.0.0
#server.address=0.0.0.0
server.servlet.session.timeout=120m

# ---- JPA: the schema is owned by Flyway, Hibernate never changes it ----
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.batch_size=30

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Email reminders: active only when SPRING_MAIL_HOST is set ----
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Email (Gmail SMTP) - credentials are loaded from environment variables; do not write them directly in the file
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=infjp@inflibnet.ac.in
spring.mail.password=effzvbwzznlutkes
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# ---- Server ----
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Actuator ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ---- Swagger / OpenAPI ----
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# ---- DailyFlow ----
# Timezone used to decide what "today" means (e.g. Asia/Kolkata)
dailyflow.timezone=${APP_TIMEZONE:Asia/Kolkata}
# At least 32 characters. Change this before deploying anywhere public.
dailyflow.jwt.secret=ChangeThisSuperSecretKeyForJwtSigningInProductionEnvironment123456
# Token lifetime in MINUTES (1440 = 24 hours)
dailyflow.jwt.expiration-minutes=1440
dailyflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
dailyflow.mail.from=${MAIL_FROM:no-reply@dailyflow.local}
dailyflow.reminders.email-check-interval-ms=${EMAIL_REMINDER_INTERVAL_MS:60000}
