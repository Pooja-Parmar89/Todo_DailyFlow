spring:
  datasource:
    url: jdbc:h2:mem:dailyflow;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

dailyflow:
  timezone: UTC
  jwt:
    # Test-only value. Real deployments must supply JWT_SECRET from the environment.
    secret: test-only-secret-test-only-secret-1234567890
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:4200
